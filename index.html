<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Drª Karina</title>
  </head>
  <body>
    <header>
      <div><img src="logo2.png" alt="Logo Dra. Karina" /></div>
    </header>
    <main>
      <nav>
        <form action="">
          <fieldset id="field_name">
            <label for="name_field">Nome</label>
            <input type="text" name="" id="name_field" />
          </fieldset>

          <fieldset>
            <label for="place_field">Local:</label>
            <select name="" id="place_field">
              <option value="">Consultório</option>
              <option value="">Sta Casa</option>
              <option value="">Casa Saúde</option>
            </select>
          </fieldset>

          <fieldset>
            <label for="date_field">Data e Hora:</label>
            <input type="date" name="" id="date_field" />
            <input type="time" name="" id="date_field" />
          </fieldset>

          <fieldset>
            <label for="weight_field"
              >Peso:<sub><i>(Em Kg)</i></sub></label
            >
            <input type="number" name="" id="weight_field" />
          </fieldset>
        </form>
        <div id="buttons">
          <button>Folha de Procedimento</button>
          <button>Receituário</button>
          <div>
            <button>Orient. Dra</button>
            <button>Orient. Paciente</button>
          </div>
        </div>
      </nav>
      <section></section>
    </main>
    <footer>
      <p>Feito com ❤ por Luiz D. Grande</p>
    </footer>
  </body>
</html>
